name: CI

on:
  pull_request:
    branches:
      - develop
      - main

# Prevent multiple concurrent runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Main CI job using reusable workflow from lf-devops
  # This job calls reusable-ci.yml which contains: lint, type-check, build, tests, build-docker, security-scan
  ci:
    uses: Liatoshynsky-Foundation/lf-devops/.github/workflows/reusable-ci.yml@feat/0/rework-ci-cd
    with:
      project-name: lf-client
      node-version: "22"
      mongodb-version: "8"
      run-build: true
      run-tests: true
      run-security-scan: true
      security-scan-on-main-only: true
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
