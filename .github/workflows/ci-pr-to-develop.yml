name: PR (develop)

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  run-lint:
    name: Run ESLint
    runs-on: 'ubuntu-latest'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run:
          npm run lint

  run-tests:
    name: Run Tests
    runs-on: 'ubuntu-latest'
    needs: [ 'run-lint' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install MongoDB
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: 8
          mongodb-container-name: mongodb
          mongodb-port: 27017
          mongodb-db: mongodb
          mongodb-username: admin
          mongodb-password: password

      - name: Install MongoDB shell
        run: |
          sudo apt-get install -y gnupg curl
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc | \
          sudo gpg -o /usr/share/keyrings/mongodb-server-8.0.gpg \
          --dearmor
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu $(lsb_release -cs)/mongodb-org/8.0 multiverse" | \
          sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update && sudo apt-get install -y mongodb-mongosh

      - name: Check MongoDB
        run: |
          for i in {1..30}; do
            mongosh --eval "db.runCommand({ ping: 1 })" localhost:27017 && echo "MongoDB is up (attempt $i)" && exit 0
            echo "Waiting for MongoDB... (attempt $i)"
            sleep 2
          done
          echo "MongoDB did not start in time!" && exit 1

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          MONGO_HOST: mongodb
          MONGO_PORT: 2017
          MONGO_DB: mongodb
          MONGO_USERNAME: admin
          MONGO_PASSWORD: password
        run:
          npm run test

  docker-build:
    name: Run docker container
    runs-on: 'ubuntu-latest'
    needs: [ 'run-lint', 'run-tests' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build docker image
        run: |
          docker build -f Dockerfile -t be-app .

      - name: Install MongoDB
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: 8
          mongodb-container-name: mongodb
          mongodb-port: 27017
          mongodb-db: mongodb
          mongodb-username: admin
          mongodb-password: password

      - name: Run be-app container
        run: |
          docker run -d --name be-app -p 3000:3000 \
            -e MONGO_HOST=mongodb \
            -e MONGO_PORT=27017 \
            -e MONGO_DB=mongodb \
            -e MONGO_USERNAME=admin \
            -e MONGO_PASSWORD=password \
            be-app
