name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - "release/*"

jobs:
  build:
    name: Build container image
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: https://lfacrstage-bkg7bmd7gacxh9e5.azurecr.io/
          username: ${{ secrets.AzureAppService_ContainerUsername_b9f545afba4f47a2a25a9fb5462ebe38 }}
          password: ${{ secrets.AzureAppService_ContainerPassword_f3693858f44448dcae56c7ae9296ed93 }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository owner
        run: echo "REPO_OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push container image to registries
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            lfacrstage-bkg7bmd7gacxh9e5.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_b9f545afba4f47a2a25a9fb5462ebe38 }}/lf-stage-client:${{ github.sha }}
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/lf-client:${{ github.sha }}
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/lf-client:latest
          file: ./Dockerfile

  deploy-azure-dev:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: "production"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "lf-client-stage"
          slot-name: "production"
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_33658204638a4070adadb0337bf888b8 }}
          images: "lfacrstage-bkg7bmd7gacxh9e5.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_b9f545afba4f47a2a25a9fb5462ebe38 }}/lf-stage-client:${{ github.sha }}"

  deploy-azure-qa:
      name: Deploy to QA Web App
      runs-on: ubuntu-latest
      needs: deploy-azure-dev
      environment:
        name: "qa"
        url: ${{ steps.deploy-to-qa-webapp.outputs.webapp-url }}
      if: github.ref == 'refs/heads/develop'
      
      steps:
        - name: Deploy to lf-client-qa-stage
          id: deploy-to-qa-webapp
          uses: azure/webapps-deploy@v3
          with:
            app-name: "lf-client-qa-stage" 
            slot-name: "production"
            publish-profile: ${{ secrets.AzureAppService_PublishProfile_QA }} 
            images: "lfacrstage-bkg7bmd7gacxh9e5.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_b9f545afba4f47a2a25a9fb5462ebe38 }}/lf-stage-client:${{ github.sha }}"
            
  deploy-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/heads/release/')
    environment:
      name: "production"
      url: ${{ steps.set-vps-url.outputs.vps-url }}

    steps:
      - name: Set lowercase repository owner
        run: echo "REPO_OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Deploy to VPS with Docker Compose
        id: deploy-to-vps
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cd /root/docker/lf-prj

            docker pull ghcr.io/${{ env.REPO_OWNER_LOWER }}/lf-client:${{ github.sha }}

            docker tag ghcr.io/${{ env.REPO_OWNER_LOWER }}/lf-client:${{ github.sha }} ghcr.io/${{ env.REPO_OWNER_LOWER }}/lf-client:latest

            docker-compose stop client client-tailscale

            docker-compose rm -f client client-tailscale

            docker-compose up -d client client-tailscale

            sleep 15

            docker-compose ps client client-tailscale

            echo "Performing health checks..."
            for i in {1..3}; do
              if docker exec lf-client wget -q -O- http://localhost:3000/ >/dev/null 2>&1; then
                echo "Client health check passed (attempt $i)"
                break
              else
                echo "Client health check failed (attempt $i)"
                if [ $i -eq 3 ]; then
                  echo "All health checks failed, rolling back..."
                  docker-compose stop client client-tailscale
                  docker-compose up -d client client-tailscale
                  exit 1
                fi
                sleep 15
              fi
            done

            echo "Checking logs for errors..."
            if docker-compose logs client | tail -20 | grep -i "error\|fatal\|exception"; then
              echo "Errors found in client logs"
              docker-compose logs client
              exit 1
            fi

            echo "Checking Tailscale connection..."
            if docker exec client-tailscale tailscale status | grep -q "client"; then
              echo "Tailscale connection successful"

              echo "Testing client accessibility via Tailscale..."
              sleep 5
              if curl -f https://client.tail6afd63.ts.net/ >/dev/null 2>&1; then
                echo "Client accessible via Tailscale at https://client.tail6afd63.ts.net"
              else
                echo "Client not accessible via Tailscale (DNS propagation may take time)"
              fi
            else
              echo "Tailscale connection issue"
              docker-compose logs client-tailscale
            fi

            echo "Cleaning up old images..."
            docker image prune -f
            docker images ghcr.io/${{ env.REPO_OWNER_LOWER }}/lf-client --format "table {{.Tag}}\t{{.CreatedAt}}" | tail -n +4 | awk '{print $1}' | xargs -r docker rmi || true

      - name: Set VPS deployment URL
        id: set-vps-url
        run: echo "vps-url=https://client.tail6afd63.ts.net" >> $GITHUB_OUTPUT
